# NOT YET RUN AGAINST A REAL DOCKER DAEMON — this development environment
# has no docker available to verify it (confirmed: `docker --version`
# returns "not found" here). Written carefully against the actual
# Dockerfiles, requirements.txt, and package.json in this repo, and the
# actual env vars app/core/config.py and lib/config.ts read — but the
# first `docker compose up` you run is the real test, same honesty
# standard as everything else in this project. Report back what breaks.
#
# MongoDB only, per instruction — no SQL database anywhere in this stack.
#
# Usage:
#   cp .env.example .env   # if you want to override defaults below
#   docker compose up --build

services:
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB_NAME: hear_the_unheard
      SECRET_KEY: ${SECRET_KEY:-dev_only_change_me_before_any_real_deployment}
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws/recognize
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  mongo_data:
